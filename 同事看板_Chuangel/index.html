          {name:'销售指标',intro:'店铺销售结果与流量转化',type:'trend',groups:[
            {name:'店铺',items:['店铺/渠道经营对比']},{name:'任务指标',items:['店铺任务目标']},{name:'销售额',items:['销售总额','指标达成率']},{name:'毛利率',items:['店铺毛利率']},{name:'毛利额',items:['店铺毛利额']},{name:'客单价',items:['店铺客单价']},
            {name:'流量',items:['进店人数','点击率','加购率','调价与定价','推广活动','推广ROI']},{name:'转化率',items:['总转化率','TOP产品转化率']}
          ]},
          {name:'库存',intro:'库存效率与残次风险',type:'donut',groups:[{name:'库存管理',items:['库存总额','库存周转','90天以上超龄分析','残次商品','周度/月度不动销','不动销处理进度','残次亏损率']}]},
          {name:'销售分析',intro:'交易结构、用户与竞品表现',type:'donut',groups:[
            {name:'销售与客户',items:['销售结构与占比','支付转化率','退款金额','退款率','平台用户画像','用户习惯分析','对应经营策略']},
            {name:'竞店对比（周度/月度）',items:['竞店排名','竞店销售定价','竞店政策','各机型占比','访客数','活动推广','补贴优惠券']}
          ]},
          {name:'项目考核',intro:'售后质量与退货风险',type:'bars',groups:[{name:'项目考核',items:['售后评价','客服评价','残次退货率']}]},
          {name:'其他过程指标',intro:'企业客户、会员、内容与培训',type:'bars',groups:[
            {name:'客户经营',items:['企业客户维护与拓展','线上消费回访','二次消费','新增会员数','会员机制','会员黏性']},
            {name:'内容与组织',items:['图文发布数','短视频发布数','内容浏览量','内容转化','内部培训场次','培训考试结果']}
          ]},
          {name:'费用',intro:'平台、推广及履约费用',type:'bars',groups:[{name:'月度费用',items:['平台扣点','平台优惠补贴','推广费用','人工费用','物流费用','其他费用','资金占用','后台费用','滞销计提','残次计提']}]},
          {name:'店铺利润（月度）',intro:'店铺盈利结果',type:'kpi',groups:[{name:'利润结果',items:['店铺利润','营业利润']}]},
          {name:'其他',intro:'品牌费用和平台政策支持',type:'bars',groups:[{name:'其他经营事项',items:['总代广告费支持','京东毛保','消费券']}]}
        ]
      }
    ];

    const departmentConfigs=config.slice(1);
    const navConfig=[
      config[0],
      {id:'business',code:'02 / BUSINESS UNITS',name:'经营板块',en:'BUSINESS OPERATIONS',title:'业务经营板块',desc:'APR、Apple电商与舒尔电商统一归入经营板块，可在页面内选择部门查看完整经营内容。',departments:departmentConfigs},
      {id:'management',code:'03 / MANAGEMENT',name:'管理',en:'MANAGEMENT',title:'管理看板',desc:'人员、财务、资产及组织效能等管理内容统一呈现。',placeholder:true},
      {id:'priorities',code:'04 / PRIORITIES',name:'重点事项',en:'KEY PRIORITIES',title:'重点事项看板',desc:'公司重点任务、责任部门、推进节点和批复结果统一呈现。',placeholder:true},
      {id:'risk',code:'05 / RISK CONTROL',name:'风险控制',en:'RISK CONTROL',title:'风险控制看板',desc:'经营、库存、资金、合规及执行风险统一呈现。',placeholder:true}
    ];

    let categoryIndex=0, sectionIndex=0, departmentIndex=0, activePeriod='day';
    const periodLabels={day:'日度',week:'周度',month:'月度',custom:'全部周期'};
    const nav=document.getElementById('primaryNav'), deptSwitch=document.getElementById('departmentSwitch'), switcher=document.getElementById('sectionSwitch'), shell=document.getElementById('sectionShell');
    const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    function periodScope(name){const text=String(name);if(/周度\s*\/\s*月度/.test(text))return ['week','month','custom'];if(/月度/.test(text))return ['month','custom'];if(/周度/.test(text))return ['week','custom'];return ['day','week','month','custom'];}
    function periodName(name){const text=String(name);if(activePeriod==='week')return text.replace(/周度\s*\/\s*月度/g,'周度');if(activePeriod==='month'){if(/周度\s*\/\s*月度/.test(text))return text.replace(/周度\s*\/\s*月度/g,'月度');return text.replace(/（月度）|\(月度\)/g,'');}return text;}
    function visibleSections(view){return view.sections.map(section=>{if(!periodScope(section.name).includes(activePeriod))return null;const groups=section.groups.map(group=>{if(!periodScope(group.name).includes(activePeriod))return null;const items=group.items.filter(item=>periodScope(item).includes(activePeriod)).map(periodName);if(!items.length)return null;return {...group,name:periodName(group.name),items};}).filter(Boolean);if(!groups.length)return null;return {...section,name:periodName(section.name),groups};}).filter(Boolean);}
    function navMeta(c){if(c.departments)return `${c.departments.length} 个经营部门`;if(c.placeholder)return '内容待接入';return `${c.sections.length} 个经营板块`;}
    function activeContent(c){return c.departments?c.departments[departmentIndex]:c;}
    function renderNav(){nav.innerHTML=navConfig.map((c,i)=>`<button class="nav-btn ${i===categoryIndex?'active':''}" data-i="${i}"><span class="nav-index">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${esc(c.name)}</strong><span>${esc(navMeta(c))}</span></span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{categoryIndex=+b.dataset.i;sectionIndex=0;render();window.scrollTo({top:0,behavior:'smooth'});});}
    function renderHeader(c){const view=activeContent(c);document.getElementById('crumbCode').textContent=c.code;document.getElementById('crumbTitle').textContent=c.departments?`${view.name}经营板块`:c.name;document.getElementById('heroEyebrow').textContent=view.en;document.getElementById('heroTitle').textContent=view.title;document.getElementById('heroDesc').textContent=view.desc;}
    function renderDepartments(c){if(!c.departments){deptSwitch.innerHTML='';return}const deptMeta=[{code:'APR',desc:'线下零售门店'},{code:'AE',desc:'Apple线上业务'},{code:'SH',desc:'舒尔线上业务'}];deptSwitch.innerHTML=`<div class="dept-heading"><span>BUSINESS UNIT</span><strong>选择经营部门</strong></div>${c.departments.map((d,i)=>`<button class="${i===departmentIndex?'active':''}" data-i="${i}"><span class="dept-code">${deptMeta[i].code}</span><span class="dept-copy"><strong>${esc(d.name)}</strong><small>${deptMeta[i].desc}</small></span><span class="dept-arrow">›</span></button>`).join('')}`;deptSwitch.querySelectorAll('button').forEach(b=>b.onclick=()=>{departmentIndex=+b.dataset.i;sectionIndex=0;renderHeader(c);renderDepartments(c);renderSections(c);window.scrollTo({top:0,behavior:'smooth'});});}
    function setActiveSection(i){sectionIndex=i;switcher.querySelectorAll('button').forEach((b,n)=>b.classList.toggle('active',n===i));}
    function renderSwitch(c){const view=activeContent(c),sections=visibleSections(view);if(sectionIndex>=sections.length)sectionIndex=0;switcher.innerHTML=sections.map((s,i)=>`<button class="${i===sectionIndex?'active':''}" data-i="${i}">${esc(s.name)}</button>`).join('');switcher.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;setActiveSection(i);document.getElementById(`section-${categoryIndex}-${departmentIndex}-${i}`).scrollIntoView({behavior:'smooth',block:'start'});});}
    function flatItems(s){return s.groups.flatMap(g=>g.items.map(x=>({group:g.name,item:x})));}
    function metricCards(s){let arr=flatItems(s).slice(0,8);return `<div class="metric-grid">${arr.map((x,i)=>`<article class="metric-card"><div class="metric-top"><div class="metric-name">${esc(x.item)}</div><div class="metric-icon">${String(i+1).padStart(2,'0')}</div></div><div class="waiting">待接入</div><div class="metric-sub">${esc(x.group)} · 数据口径待绑定</div></article>`).join('')}</div>`;}
    function bars(){const hs=[52,78,66,88,58,73,84];return `<div class="chart-area">${hs.map((h,i)=>`<div class="bar-set"><i class="bar" style="height:${h}%"></i><i class="bar alt" style="height:${Math.max(24,h-18)}%"></i><span>${['D-6','D-5','D-4','D-3','D-2','D-1','当期'][i]}</span></div>`).join('')}<div class="chart-note">趋势及对比效果示意 · 数据待接入</div></div>`;}
    function donut(items){return `<div class="donut-wrap"><div class="donut"></div><div class="legend">${items.slice(0,5).map((x,i)=>`<div class="legend-item"><i style="background:${['#2f69c2','#64a4da','#c79118','#7b91ad','#42a287'][i]}"></i><span>${esc(x.item)}</span><strong>待接入</strong></div>`).join('')}</div></div>`;}
    function details(s){const items=flatItems(s);return `<div class="detail-panel"><article class="viz-card"><div class="card-head"><div><h3>${s.type==='donut'?'结构占比 / 透视效果':'趋势与对比效果'}</h3><span>示意图仅用于确认最终呈现形式</span></div><span class="section-tag">数据待接入</span></div>${s.type==='donut'?donut(items):bars()}</article><article class="dimension-card"><div class="card-head"><div><h3>完整数据维度</h3><span>共 ${items.length} 项</span></div></div><div class="dimension-list">${items.map((x,i)=>`<div class="dimension-row"><span class="dim-no">${String(i+1).padStart(2,'0')}</span><span class="dim-copy"><strong>${esc(x.item)}</strong><small>${esc(x.group)}</small></span><span class="status">待接入</span></div>`).join('')}</div></article></div>`;}
    function analysis(s){return `<article class="analysis-card"><div class="analysis-top"><div><h3>总结分析 · ${esc(s.name)}</h3><span>ANALYSIS FOLLOWS EACH BUSINESS SECTION</span></div><span>当前：待接入</span></div><div class="analysis-body"><div class="analysis-item"><b>经营结论</b><p>待接入该板块数据后，自动提炼结果、结构、趋势和关键变化。</p></div><div class="analysis-item"><b>异常与特殊节点</b><p>待识别目标偏差、同比环比异常、重点活动节点及需关注事项。</p></div><div class="analysis-item"><b>管理动作建议</b><p>待结合数据形成明确动作、责任方向、处理优先级和复盘重点。</p></div></div></article>`;}
    function allMetricCards(items,groupName){return `<div class="metric-grid">${items.map((x,i)=>`<article class="metric-card"><div class="metric-top"><div class="metric-name">${esc(x.item||x)}</div><div class="metric-icon">${String(i+1).padStart(2,'0')}</div></div><div class="waiting">待接入</div><div class="metric-sub">${esc(x.group||groupName)} · 数据口径待绑定</div></article>`).join('')}</div>`;}
    function processGroup(g,i){const isSop=/SOP/.test(g.name), isJourney=/客户|过程运营/.test(g.name);if(isSop)return `<article class="ops-card"><div class="ops-head"><div><h3>${esc(g.name)} · 巡检清单</h3><span>不作为单一数值展示，按检查项呈现执行状态</span></div><span class="pending-chip">最新检查待接入</span></div><div class="check-list">${g.items.map((x,n)=>`<div class="check-row"><span class="check-icon">${String(n+1).padStart(2,'0')}</span><strong>${esc(x)}</strong><span class="pending-chip">待检查</span></div>`).join('')}</div></article>`;if(isJourney){const steps=g.items.slice(0,5),remain=g.items.slice(5);return `<article class="ops-card"><div class="ops-head"><div><h3>${esc(g.name)} · 运营闭环</h3><span>按动作路径查看推进和反馈结果</span></div><span class="pending-chip">状态待接入</span></div><div class="journey">${steps.map((x,n)=>`<div class="journey-step"><span class="journey-dot">${n+1}</span><strong>${esc(x)}</strong><small>待接入</small></div>`).join('')}</div>${remain.length?`<div class="training-board">${remain.map(x=>`<div class="training-item"><span>配套能力</span><strong>${esc(x)}</strong><small>执行记录待接入</small></div>`).join('')}</div>`:''}<p class="journey-note">预览逻辑：不仅看结果数值，同时呈现动作是否完成、客户反馈及下一步安排。</p></article>`}return `<article class="ops-card"><div class="ops-head"><div><h3>${esc(g.name)} · 内容与能力</h3><span>按任务、产出及复盘结果呈现</span></div><span class="pending-chip">内容待接入</span></div><div class="training-board">${g.items.map(x=>`<div class="training-item"><span>运营事项</span><strong>${esc(x)}</strong><small>最新进展与结果待接入</small></div>`).join('')}</div></article>`;}
    function processPreview(s){return `<div class="content-preview"><div class="preview-banner"><div><strong>过程管理与运营闭环</strong><p>将制度、动作和团队能力从“指标卡”改为检查、推进和复盘视图。</p></div><span class="preview-badge">业务内容预览 · 待接入</span></div><div class="ops-grid">${s.groups.map(processGroup).join('')}</div></div>`;}
    function personaPreview(s){
      const items=flatItems(s),swatches=['#2f69c2','#65a6db','#c79218','#879bb4'];
      const keyNames=['支付转化率','退款金额','退款率','访客数'];
      let keyItems=keyNames.map(n=>items.find(x=>x.item===n)).filter(Boolean);
      if(!keyItems.length)keyItems=items.slice(0,4);
      const structure=items.filter(x=>/销售结构|主机|1PP|3PP|各机型占比/.test(x.item)).slice(0,4);
      const structureItems=structure.length?structure:[{item:'销售结构'}];
      const competitorGroup=s.groups.find(g=>/竞店/.test(g.name)),competitor=(competitorGroup||{items:[]}).items;
      const compareItems=competitor.length?competitor:items.filter(x=>/竞店|活动|补贴|优惠/.test(x.item)).slice(0,6);
      const narrative=items.filter(x=>/画像|习惯|策略/.test(x.item));
      const insightItems=narrative.length?narrative:[{item:'平台用户画像'},{item:'用户习惯分析'},{item:'对应经营策略'}];
      const widths=[72,56,81,64,48,75,59];
      return `<div class="commerce-kpis">${keyItems.map((x,i)=>`<article class="commerce-kpi"><span>${esc(x.item)}</span><strong>待接入</strong><small>${esc(x.group||'交易指标')} · 数据口径待绑定</small></article>`).join('')}</div>
      <div class="commerce-analysis-grid ${competitorGroup?'':'single'}">
        <article class="analysis-visual-card"><div class="visual-head"><h3>销售结构透视</h3><span>品类 / 机型 / 业务结构</span></div><div class="structure-layout"><div class="structure-donut"></div><div class="structure-legend">${structureItems.map((x,i)=>`<div><i style="background:${swatches[i%swatches.length]}"></i><span>${esc(x.item)}</span><b>待接入</b></div>`).join('')}</div></div></article>
        ${competitorGroup?`<article class="analysis-visual-card"><div class="visual-head"><h3>${esc(competitorGroup.name)}</h3><span>排名 / 规模 / 定价 / 活动</span></div><div class="compare-list">${compareItems.map((x,i)=>`<div class="compare-row"><span>${esc(typeof x==='string'?x:x.item)}</span><div class="compare-track"><i style="width:${widths[i%widths.length]}%"></i></div><b>待接入</b></div>`).join('')}</div></article>`:''}
      </div>
      <div class="profile-dashboard">
        <article class="profile-chart-card"><div class="visual-head"><h3>平台用户画像</h3><span>人群结构可视化</span></div><div class="profile-pies"><div class="profile-pie"><div class="pie-ring"><span>待接入</span></div><strong>年龄层分布</strong><small>核心年龄与占比</small></div><div class="profile-pie"><div class="pie-ring alt"><span>待接入</span></div><strong>城市层级 / 偏好</strong><small>区域、价格与产品倾向</small></div></div></article>
        <article class="funnel-card"><div class="visual-head"><h3>用户行为转化漏斗</h3><span>从访问到复购</span></div><div class="funnel-flow">${['浏览','点击','加购','支付','复购'].map((x,i)=>`<div class="funnel-step" style="width:${100-i*9}%"><span>${x}</span><b>待接入</b></div>`).join('')}</div></article>
        <article class="decision-card"><div class="visual-head"><h3>洞察与经营策略</h3><span>画像驱动经营动作</span></div><div class="decision-list">${insightItems.slice(0,4).map((x,i)=>`<div class="decision-item"><em>${String(i+1).padStart(2,'0')}</em><div><b>${esc(x.item)}</b><span>分析结论与建议待接入</span></div></div>`).join('')}</div></article>
      </div>`;
    }
    function assessmentPreview(s){const items=flatItems(s);return `<div class="assessment-board"><div class="assessment-summary"><div><span>考核事项</span><strong>${items.length} 项</strong></div><div><span>已完成</span><strong>待接入</strong></div><div><span>需整改</span><strong>待接入</strong></div></div><table class="assessment-table"><thead><tr><th>检查 / 考核项目</th><th>最近结果</th><th>责任归属</th><th>当前状态</th></tr></thead><tbody>${items.map(x=>`<tr><td class="assessment-name">${esc(x.item)}</td><td class="owner-placeholder">结果待接入</td><td class="owner-placeholder">责任人待接入</td><td><span class="pending-chip">待检查</span></td></tr>`).join('')}</tbody></table></div>`;}
    function projectPreview(s){const items=flatItems(s);return `<div class="content-preview"><div class="preview-banner"><div><strong>项目与协同事项</strong><p>按事项状态、关键节点和下一步动作呈现，不使用销售类图表。</p></div><span class="preview-badge">推进视图 · 待接入</span></div><div class="project-grid">${items.map((x,i)=>`<article class="project-card"><div class="project-top"><h3>${esc(x.item)}</h3><span class="project-state">待更新</span></div><div class="project-line"></div><div class="project-meta"><span>当前节点：待接入</span><span>责任人：待接入</span></div></article>`).join('')}</div></div>`;}
    function sectionContent(s){const items=flatItems(s);if(s.name==='其他过程指标')return processPreview(s);if(s.name==='项目考核')return assessmentPreview(s);if(s.name==='其他')return projectPreview(s);if(s.name==='销售分析'&&items.some(x=>/画像|习惯|策略/.test(x.item)))return personaPreview(s);return `${metricCards(s)}${details(s)}`;}
    function sectionBlock(s,i){return `<section class="section-block" id="section-${categoryIndex}-${departmentIndex}-${i}" data-section-index="${i}"><div class="section-head"><div><h2>${esc(s.name)}</h2><p>${esc(s.intro)}</p></div><span class="section-tag">${periodLabels[activePeriod]} · ${flatItems(s).length} 项呈现维度</span></div>${sectionContent(s)}${analysis(s)}</section>`;}
    function bindSectionObserver(){if(window.sectionObserver)window.sectionObserver.disconnect();window.sectionObserver=new IntersectionObserver(entries=>{const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(visible)setActiveSection(+visible.target.dataset.sectionIndex);},{rootMargin:'-230px 0px -62% 0px',threshold:.01});document.querySelectorAll('.section-block').forEach(x=>window.sectionObserver.observe(x));}
    function renderPlaceholder(c){switcher.innerHTML='';shell.innerHTML=`<section class="empty-state"><div><div class="empty-icon">···</div><h2>${esc(c.name)}内容待接入</h2><p>${esc(c.desc)}<br>当前静态框架仅预留页面入口，后续根据确认的数据维度补充呈现。</p><span class="empty-pill">数据状态 · 待接入</span></div></section>`;if(window.sectionObserver)window.sectionObserver.disconnect();}
    function renderSections(c){if(c.placeholder){renderPlaceholder(c);return}const view=activeContent(c),sections=visibleSections(view);renderSwitch(c);shell.innerHTML=sections.map(sectionBlock).join('');bindSectionObserver();}
    function render(){const c=navConfig[categoryIndex];renderNav();renderHeader(c);renderDepartments(c);renderSections(c)}
    const periodButtons=[...document.querySelectorAll('.period button')],periodKeys=['day','week','month','custom'],dateBox=document.querySelector('.date-box');
    dateBox.textContent=`数据周期 · ${periodLabels[activePeriod]}待选择`;
    periodButtons.forEach((b,i)=>b.onclick=()=>{activePeriod=periodKeys[i];sectionIndex=0;periodButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');dateBox.textContent=`数据周期 · ${periodLabels[activePeriod]}待选择`;renderSections(navConfig[categoryIndex]);window.scrollTo({top:0,behavior:'smooth'});});
    const stickyControls=document.getElementById('stickyControls');
    function updateStickyControls(){stickyControls.classList.toggle('is-compact',window.scrollY>300)}
    window.addEventListener('scroll',updateStickyControls,{passive:true});
    render();
    updateStickyControls();
  </script>
</body>
</html>
