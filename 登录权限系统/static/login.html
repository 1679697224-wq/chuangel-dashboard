<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>传天羽经营看板 · 登录</title>
<style>
:root{--navy:#0b2342;--blue:#2f69c2;--gold:#c79118}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0b2342 0%,#173f6d 60%,#285893 100%);display:grid;place-items:center;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.card{width:400px;max-width:92vw;background:#fff;border-radius:18px;padding:34px 34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.logo{width:100%;max-height:64px;object-fit:contain;margin-bottom:22px;border-radius:10px;background:#fff;padding:6px}
h1{font-size:19px;margin:0 0 4px;color:#0f2745}
.sub{font-size:12.5px;color:#6d7f96;margin-bottom:24px}
label{display:block;font-size:13px;color:#3d5a7a;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:11px 13px;border:1px solid #d6e0ec;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#2f69c2;box-shadow:0 0 0 3px rgba(47,105,194,.15)}
.btn{width:100%;margin-top:22px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#2f69c2,#234e8c);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.err{color:#c94d5c;font-size:13px;margin-top:12px;min-height:18px}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-top:14px;border-top:1px dashed #e0e7ef}
.roles span{font-size:11px;color:#8a9aab;background:#eef3f9;border-radius:999px;padding:4px 10px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/logo.png" alt="传天羽" onerror="this.style.display='none'">
  <h1>传天羽 · 经营看板登录</h1>
  <div class="sub">按角色进入各自板块；老板为总看板</div>
  <label>账号</label>
  <input id="u" placeholder="请输入账号" autocomplete="username">
  <label>密码</label>
  <input id="p" type="password" placeholder="请输入密码" autocomplete="current-password">
  <button class="btn" onclick="login()">登 录</button>
  <div class="err" id="err"></div>
  <div class="roles"><span>老板</span><span>财务</span><span>人事</span><span>APR负责人</span><span>苹果电商负责人</span><span>舒尔负责人</span></div>
</div>
<script>
function login(){
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  var err = document.getElementById('err');
  if(!u || !p){ err.textContent = '请输入账号和密码'; return; }
  fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p})})
    .then(function(res){ return res.json().then(function(d){ return {ok: res.ok, d: d}; }); })
    .then(function(r){
      if(!r.ok){ err.textContent = r.d.error || '登录失败'; return; }
      location.href = '/portal.html';
    })
    .catch(function(){ err.textContent = '网络错误，请重试'; });
}
document.getElementById('p').addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });
</script>
</body>
</html>
